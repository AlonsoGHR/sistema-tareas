name: Validacion de tareas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mostrar version
        run: python --version
      - name: Verificar sintaxis
        run: python -m compileall -q main.py tareas.py tests
      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -s tests -v
